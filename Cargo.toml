[package]
name = "catsbot"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
teloxide = { version = "0.17", features = ["full"] }
log = "0.4"
pretty_env_logger = "0.5"
dotenvy = "0.15"
thiserror = "2"
strum = { version = "0.28", features = ["derive"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }
anyhow = "1.0"
fastembed = "5.17"
rand = "0.10"
reqwest = { version = "0.12.28", features = ["socks", "json"]}
libsqlite3-sys = "0.30"
sqlite-vec = "0.1"
bytes = "1.12"
flume = "0.12"
skia-rs-core = "0.3"    # Core types: Point, Rect, Matrix, Color
skia-rs-path = "0.3"    # Path geometry and operations
skia-rs-paint = "0.3"   # Paint, shaders, filters
skia-rs-canvas = { version = "0.3", features = ["text", "codec"] }  # Canvas and surface
skia-rs-codec = "0.3"
skia-rs-text = "0.3"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
hex = "0.4"
sha2 = "0.11"
futures = "0.3"
inventory = "0.3"
