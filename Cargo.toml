[package]
name = "catsbot"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
teloxide = { git = "https://github.com/Mar2ianen/teloxide-fork.git", tag = "v0.20.0", features = ["full"] }
log = "0.4"
dotenvy = "0.15"
thiserror = "2"
strum = { version = "0.28", features = ["derive"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }
anyhow = "1.0"
fastembed = "5.17"
rand = "0.10"
reqwest = { version = "0.13.4", features = ["socks", "json"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
sqlite-vec = "0.1"
bytes = { version = "1.12", features = ["serde"] }
flume = "0.12"
skia-rs-core = "0.3"
skia-rs-path = "0.3"
skia-rs-paint = "0.3"
skia-rs-canvas = { version = "0.3", features = ["text", "codec"] }
skia-rs-codec = "0.3"
skia-rs-text = "0.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.11"
futures = "0.3"
inventory = "0.3"
base64 = "0.23"
chrono = "0.4"
env_logger = "0.11"
terminal_size = "0.4"
rayon = "1.12"
unicode-segmentation = "1.13"
moka = { version = "0.12", features = ["future"] }
bonsaidb = { version = "0.5", default-features = false, features = ["local", "async"] }
uuid = { version = "1.26", features = ["v4", "v7", "serde"] }
