[package]
name = "catsbot"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
teloxide = { version = "0.17", features = ["full"] }
log = "0.4"
pretty_env_logger = "0.5"
dotenvy = "0.15"
thiserror = "2"
strum = { version = "0.28", features = ["derive"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }
anyhow = "1.0"
fastembed = "5.17"
rand = "0.10"
reqwest = { version = "0.12.28", features = ["socks"]}
libsqlite3-sys = "0.30"
sqlite-vec = "0.1"
bytes = "1.12"
fume = "0.12"
skia-rs-safe = "0.3"
